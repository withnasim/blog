title: Najura Blog
tagline: Puzzle tips, game guides and studio news
description: Puzzle tips, game guides and news from Najura, a small independent studio making cozy offline puzzle games and friendly apps.
url: "https://blog.najura.com"
baseurl: ""
lang: en_US
permalink: /:year/:month/:title/
markdown: kramdown
exclude: [README.md]

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

logo: /assets/favicon.svg
author: Najura
social:
  name: Najura
  links:
    - https://najura.com/
defaults:
  - scope: { path: "", type: posts }
    values: { image: "https://games.najura.com/assets/games/brickwise-feature.jpg" }
